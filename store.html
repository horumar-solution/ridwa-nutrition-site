<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ridwa Nutrition Center — premium supplements, Marine Collagen, skincare and wellness. Be Smart, Eat Smart." />
  <title>Ridwa Nutrition Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  <style>

    /* ── RESETS & ROOT ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    body { -webkit-font-smoothing: antialiased; overflow-x: hidden; font-family: 'DM Sans', system-ui, sans-serif; background: var(--off-white); color: var(--gray-900); }

    :root {
      /* Ridwa brand palette */
      --forest:        #13402a;
      --green-dark:    #1e6b3a;
      --green-mid:     #4a9e6b;
      --green-light:   #88c9a0;
      --green-pale:    #f2f8f4;
      --gold:          #c9933a;
      --amber:         #e8b86d;
      --cream:         #faf6ef;
      --cream-mid:     #f2ebe0;

      /* Neutrals */
      --white:         #ffffff;
      --off-white:     #faf6ef;
      --gray-50:       #f5f0e8;
      --gray-100:      #e8e2d8;
      --gray-400:      #9c9488;
      --gray-600:      #5a5248;
      --gray-900:      #1a1208;

      /* WhatsApp */
      --wa:            #25D366;
      --wa-dark:       #128C7E;

      /* System */
      --ease-out:      cubic-bezier(0.23, 1, 0.32, 1);
      --ease-expo:     cubic-bezier(0.16, 1, 0.3, 1);
      --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
      --sh-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --sh-md: 0 4px 16px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --sh-lg: 0 12px 40px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.06);
    }

    /* ── BRAND HEADER ───────────────────────────────── */
    .brand-header {
      background: var(--cream);
      padding: 36px 24px 28px;
      text-align: center;
      border-bottom: 1px solid var(--gray-100);
      position: relative;
    }

    .brand-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 48px; height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--amber));
      border-radius: var(--r-full);
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .brand-logo-wrap img {
      height: 72px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .brand-tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 15px;
      font-style: italic;
      color: var(--gray-600);
      letter-spacing: .02em;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--gray-400);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* Trust badges */
    .brand-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--green-pale);
      border: 1px solid rgba(30,107,58,.18);
      color: var(--green-dark);
      border-radius: var(--r-full);
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .trust-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* Social icons */
    .header-socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .soc-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(30,107,58,.08);
      border: 1px solid rgba(30,107,58,.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--green-dark);
      transition: transform 200ms var(--ease-out), background 200ms, color 200ms;
      text-decoration: none;
    }

    .soc-icon svg { width: 17px; height: 17px; }

    @media (hover: hover) and (pointer: fine) {
      .soc-icon:hover { transform: translateY(-3px) scale(1.08); }
      .soc-icon.ig:hover  { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; border-color: transparent; }
      .soc-icon.fb:hover  { background: #1877f2; color: #fff; border-color: transparent; }
      .soc-icon.tk:hover  { background: #000; color: #fff; border-color: transparent; }
      .soc-icon.wa:hover  { background: var(--wa); color: #fff; border-color: transparent; }
    }

    .soc-icon:active { transform: scale(0.95); }

    /* ── PLACEHOLDER (products will go here) ─────────── */
    .coming-soon {
      padding: 64px 24px;
      text-align: center;
      color: var(--gray-400);
      font-size: 13px;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── FLOATING WHATSAPP ──────────────────────────── */
    .float-wa {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 300;
      display: flex; align-items: center; gap: 9px;
      background: var(--wa);
      color: #fff;
      font-size: 13px; font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      padding: 13px 20px;
      border-radius: var(--r-full);
      box-shadow: 0 4px 20px rgba(37,211,102,.38);
      transition: transform 180ms var(--ease-out), box-shadow 180ms;
      text-decoration: none;
    }

    .float-wa svg { width: 18px; height: 18px; flex-shrink: 0; }

    @media (hover: hover) and (pointer: fine) {
      .float-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,211,102,.45); }
    }

    .float-wa:active { transform: scale(0.97); }

    /* ── FOOTER ─────────────────────────────────────── */
    .site-footer {
      background: var(--forest);
      padding: 40px 24px 28px;
    }

    .footer-inner {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .footer-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .footer-logo-wrap img {
      height: 56px;
      width: auto;
      object-fit: contain;
      filter: invert(1) saturate(0) brightness(1.6) contrast(6);
      mix-blend-mode: screen;
    }

    .footer-tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(255,255,255,.45);
      margin-bottom: 20px;
    }

    .footer-socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .footer-soc {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.65);
      transition: transform 200ms var(--ease-out), background 200ms, color 200ms, border-color 200ms;
      text-decoration: none;
    }

    .footer-soc svg { width: 16px; height: 16px; }

    @media (hover: hover) and (pointer: fine) {
      .footer-soc:hover { transform: translateY(-3px) scale(1.1); }
      .footer-soc.ig:hover { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; border-color: transparent; }
      .footer-soc.fb:hover { background: #1877f2; color: #fff; border-color: transparent; }
      .footer-soc.tk:hover { background: #000; color: #fff; border-color: transparent; }
      .footer-soc.wa:hover { background: var(--wa); color: #fff; border-color: transparent; }
    }

    .footer-soc:active { transform: scale(0.93); }

    .footer-divider {
      width: 32px; height: 1px;
      background: rgba(255,255,255,.12);
      margin: 0 auto 16px;
    }

    .footer-copy {
      font-size: 11px;
      color: rgba(255,255,255,.22);
      font-family: 'Montserrat', sans-serif;
      letter-spacing: .07em;
      text-transform: uppercase;
      line-height: 1.7;
    }

    /* ── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 480px) {
      .brand-header { padding: 28px 20px 24px; }
      .brand-logo-wrap img { height: 60px; }
      .float-wa span { display: none; }
      .float-wa { padding: 14px; border-radius: 50%; }
    }

  </style>
</head>
